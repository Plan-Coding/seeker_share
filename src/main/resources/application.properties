spring.application.name=seeker-share
spring.threads.virtual.enabled=true

server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}
server.shutdown=graceful

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${MAX_FILE_SIZE:100MB}
seeker.share.storage-location=${SHARE_STORAGE:${java.io.tmpdir}/seeker-share/uploads}
seeker.share.max-storage-bytes=${MAX_STORAGE_BYTES:1073741824}
seeker.share.expiration-hours=${EXPIRATION_HOURS:24}
seeker.share.admin-token=${ADMIN_TOKEN:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Seeker Share Java Web application
info.app.version=0.0.1-SNAPSHOT

spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
